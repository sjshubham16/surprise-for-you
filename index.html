<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🎂 BirthdayVerse Premium</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Cinzel:wght@700;900&display=swap" rel="stylesheet">

</head>

<body>

<!-- ================= Loader ================= -->

<div id="loader">

    <h1>🎂 BirthdayVerse</h1>

    <div class="loading">

        <div class="loading-bar"></div>

    </div>

    <p>Preparing Something Magical...</p>

</div>

<!-- ================= Background ================= -->

<canvas id="fireworksCanvas"></canvas>

<div class="stars"></div>

<div id="sparkles"></div>

<div id="hearts"></div>

<div class="moon"></div>

<!-- ================= Balloons ================= -->

<div class="balloons">

    <div class="balloon b1"></div>

    <div class="balloon b2"></div>

    <div class="balloon b3"></div>

    <div class="balloon b4"></div>

</div>

<!-- ================= Welcome ================= -->

<section id="welcome">

    <div class="royal-card">

        <h3>✨ Welcome ✨</h3>

        <h1>BirthdayVerse</h1>

        <p>

            Create an unforgettable birthday surprise.

        </p>

        <input
            type="text"
            id="username"
            placeholder="🎂 Birthday Person Name">

        <div class="buttons">

            <button id="startBtn">

                🎉 Start Celebration

            </button>

            <button id="cancelBtn">

                Cancel

            </button>

        </div>

    </div>

</section>

<!-- ================= Birthday Scene ================= -->

<section id="birthdayScene">

    <div class="wish-card">

        <h1 id="wishName">

            🎂 Happy Birthday

        </h1>

        <p>

            Wishing you endless happiness,
            success and unforgettable memories.

        </p>

    </div>

    <!-- Cake -->

    <div id="cakeSection">

        <div id="cake3D">

            <div class="cake-base"></div>

            <div class="cake-middle"></div>

            <div class="cake-top"></div>

            <div class="candle"></div>

            <div class="flame"></div>

        </div>

    </div>

    <!-- Gift -->

    <div class="gift-area">

        <div id="giftBox" class="gift">

            <div class="gift-lid"></div>

            <div class="gift-body"></div>

            <div class="gift-ribbon-v"></div>

            <div class="gift-ribbon-h"></div>

        </div>

        <button id="openGift">

            🎁 Open Gift

        </button>

    </div>

    <!-- Character -->

    <div class="birthday-character">

        🥳

    </div>

    <!-- Celebration -->

    <button id="celebrate">

        🎆 Celebrate

    </button>

</section>

<!-- ================= Gallery ================= -->

<section id="gallery">

    <h2>

        📸 Beautiful Memories

    </h2>

    <div class="gallery-grid">

    <img src="bandriya.jpg" alt="Photo 1">

<img src="shreya2.jpeg" alt="Photo 2">

<img src="shreya.jpeg" alt="Photo 3">

    </div>

</section>

<!-- ================= Footer ================= -->

<footer>

    Made with ❤️ using HTML • CSS • JavaScript

</footer>

<script src="script.js"></script>

</body>

</html>
